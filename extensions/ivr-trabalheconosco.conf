[ivr-trabalheconosco]
exten => s,1,NoOp(Trabalhe Conosco: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(LOOPCPF=0)

 same => n(loop),Background(custom/digite_cpf)
 same => n,WaitExten(8)

exten => _X.,1,Set(CPF=${EXTEN})

 ; placeholder for validation via AGI
 same => n,Set(CPFValido=VALIDO)

 same => n,GotoIf($["${CPFValido}"="VALIDO"]?ok:retry)

 same => n(ok),Playback(custom/ir_para_site)
 same => n,Hangup()

 same => n(retry),Set(LOOPCPF=$[${LOOPCPF}+1])
 same => n,GotoIf($[${LOOPCPF}<3]?loop:hang)

 same => n(hang),Hangup()
