[ivr-menugeral]
exten => s,1,NoOp(Entrada Menu Geral: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=8)

 same => n(start),Background(custom/menu_principal)
 same => n,WaitExten(8)
 same => n,Goto(start)

exten => 1,1,Goto(ivr-varejista,s,1)
exten => 2,1,Goto(ivr-consumidor,s,1)
exten => 3,1,Goto(ivr-fornecedor,s,1)
exten => 4,1,Goto(ivr-colaborador,s,1)
exten => 5,1,Goto(ivr-trabalheconosco,s,1)

exten => 0,1,Playback(custom/agradecimento)
 same => n,Hangup()
