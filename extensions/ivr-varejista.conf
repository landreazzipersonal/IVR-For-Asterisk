[ivr-varejista]
exten => s,1,NoOp(Varejista: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(LOOPDOC=0)

 same => n(start),Background(custom/menu_varejista_inicio)
 same => n,WaitExten(8)
 same => n,Goto(start)

exten => 1,1,Goto(recebe-doc,s,1)
exten => 2,1,Goto(ivr-menugeral,s,1)

; =============================
; CPF / CNPJ VALIDATION
; =============================
[recebe-doc]
exten => s,1,Background(custom/digite_cpf_cnpj)
 same => n,WaitExten(8)

exten => _X.,1,Set(DOC=${EXTEN})
 same => n,Set(DOC_VALIDO=VALIDO)              ; placeholder AGI
 same => n,Set(DOC_CADASTRADO=SIM)             ; placeholder AGI

 same => n,GotoIf($["${DOC_VALIDO}"="VALIDO"]?check:retry)

 same => n(check),GotoIf($["${DOC_CADASTRADO}"="SIM"]?menu:nao-cadastrado)

 same => n(retry),Set(LOOPDOC=$[${LOOPDOC}+1])
 same => n,Playback(custom/dados_incorretos)
 same => n,GotoIf($[${LOOPDOC}<3]?s:fail)

 same => n(fail),Hangup()

; =============================
; NOT REGISTERED FLOW
; =============================
 same => n(nao-cadastrado),Playback(custom/nao_cadastrado)
 same => n,Background(custom/opcao_cadastro)
 same => n,WaitExten(8)

exten => 1,1,Goto(cadastro,s,1)
exten => 2,1,Goto(ivr-menugeral,s,1)

; =============================
; CADASTRO FLOW
; =============================
[cadastro]
exten => s,1,Playback(custom/enviar_link_sms)
 same => n,Hangup()

; =============================
; MAIN MENU
; =============================
[menu-varejista]
exten => s,1,NoOp(Menu Principal Varejista)
 same => n,Background(custom/menu_varejista)
 same => n,WaitExten(8)

exten => 1,1,Goto(financeiro,s,1)
exten => 2,1,Goto(dial-vendedor,s,1)
exten => 3,1,Goto(conecta,s,1)
exten => 0,1,Goto(ivr-menugeral,s,1)

; ---------- financeiro ----------
[financeiro]
exten => s,1,Playback(custom/aguarde_atendimento)
 same => n,Dial(SIP/fila/1111,120)
 same => n,Hangup()

; ---------- contato vendedor ----------
[dial-vendedor]
exten => s,1,Playback(custom/aguarde_atendimento)
 same => n,Dial(SIP/fila/1111,120)
 same => n,Hangup()

; ---------- conecta ----------
[conecta]
exten => s,1,Playback(custom/aguarde_atendimento)
 same => n,Dial(SIP/fila/1111,120)
 same => n,Hangup()
