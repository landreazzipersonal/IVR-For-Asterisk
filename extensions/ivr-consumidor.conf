[ivr-consumidor]
exten => s,1,NoOp(Consumidor: ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(LOOPCPF=0)

 same => n(start),Playback(custom/aviso_gravacao)
 same => n,Goto(recebe-cpf,s,1)

; =============================
; CPF VALIDATION
; =============================
[recebe-cpf]
exten => s,1,Background(custom/digite_cpf)
 same => n,WaitExten(8)

exten => _X.,1,Set(CPF=${EXTEN})
 same => n,Set(CPF_VALIDO=VALIDO)              ; placeholder AGI
 same => n,Set(CPF_CADASTRADO=SIM)             ; placeholder AGI

 same => n,GotoIf($["${CPF_VALIDO}"="VALIDO"]?check:retry)

 same => n(check),GotoIf($["${CPF_CADASTRADO}"="SIM"]?menu:retry)

 same => n(retry),Set(LOOPCPF=$[${LOOPCPF}+1])
 same => n,Playback(custom/dados_incorretos)
 same => n,GotoIf($[${LOOPCPF}<3]?s:fail)

 same => n(fail),Playback(custom/finalizacao)
 same => n,Hangup()

; =============================
; MAIN MENU
; =============================
[menu-consumidor]
exten => s,1,NoOp(Menu Consumidor)
 same => n,Background(custom/menu_consumidor)
 same => n,WaitExten(8)

exten => 1,1,Playback(custom/informacoes_produto)
 same => n,Dial(SIP/fila/1111,120)
 same => n,Hangup()

exten => 2,1,Goto(ivr-trabalheconosco,s,1)

exten => 3,1,Goto(ivr-fornecedor,s,1)

exten => 0,1,Goto(ivr-menugeral,s,1)
